spring.application.name=fin_manager

# Charge le fichier .env (optionnel : pas d'erreur s'il est absent)
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# Base de données MySQL (valeurs lues dans .env)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Format des dates JSON (LocalDate / LocalDateTime) : voir config/JacksonConfig.java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
